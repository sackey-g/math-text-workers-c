<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Crisp White Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Subtle Light Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Vibrant Curve Gradient (Stunning on white) -->
    <linearGradient id="curveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="35%" stop-color="#3B82F6"/>
      <stop offset="65%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Light Theme -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3B82F6" flood-opacity="0.25"/>
    </filter>
    
    <filter id="pointShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F43F5E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Base (White) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Geometric Polar & Radial Grid (Abstract Math Space) -->
  <g stroke="#64748B" stroke-opacity="0.12" stroke-width="1.5" fill="none">
    <!-- Concentric Circles -->
    <circle cx="256" cy="256" r="60"/>
    <circle cx="256" cy="256" r="120"/>
    <circle cx="256" cy="256" r="180"/>
    <circle cx="256" cy="256" r="240"/>
    
    <!-- Radial Axes -->
    <line x1="16" y1="256" x2="496" y2="256"/>
    <line x1="256" y1="16" x2="256" y2="496"/>
    <line x1="16" y1="256" x2="496" y2="256" transform="rotate(30 256 256)"/>
    <line x1="16" y1="256" x2="496" y2="256" transform="rotate(60 256 256)"/>
    <line x1="16" y1="256" x2="496" y2="256" transform="rotate(120 256 256)"/>
    <line x1="16" y1="256" x2="496" y2="256" transform="rotate(150 256 256)"/>
  </g>

  <!-- The Differential Slope Triangle (dx, dy visualization) -->
  <g stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- Path corresponding exactly to the tangent slope (-1.708) -->
    <path d="M 256 256 L 344 256 L 344 106" fill="none" stroke-dasharray="6 8"/>
    <!-- Right angle indicator -->
    <path d="M 328 256 L 328 240 L 344 240" fill="none" stroke-dasharray="none"/>
    <!-- Precise vertex dots -->
    <circle cx="344" cy="256" r="4" fill="#94A3B8" stroke="none"/>
    <circle cx="344" cy="106" r="4" fill="#94A3B8" stroke="none"/>
  </g>

  <!-- The Main Mathematical Function Curve -->
  <!-- A perfect cubic bezier curve representing y = f(x) -->
  <path d="M 64 420 C 256 420, 256 92, 448 92" fill="none" stroke="url(#curveGrad)" stroke-width="26" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- The Tangent Line (Derivative at inflection point) -->
  <!-- Perfectly mathematically aligned with the curve's slope at t=0.5 -->
  <!-- Using a dark slate color for a technical blueprint contrast -->
  <line x1="116" y1="495" x2="396" y2="17" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <!-- The Focal Point of Tangency -->
  <g filter="url(#pointShadow)">
    <circle cx="256" cy="256" r="14" fill="#FFFFFF" stroke="#F43F5E" stroke-width="6"/>
  </g>

</svg>
